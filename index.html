<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CV Library</title>
<style>
  :root{
    --navy:#0f1236;
    --navy-soft:#1b1a68;
    --pink:#d81b60;
    --cream:#fdeedd;
    --page:#a9b0d4;
    --ink:#1a1a1a;
    --muted:#555;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:"Segoe UI","Open Sans",Arial,Helvetica,sans-serif;
    background:linear-gradient(160deg,#a9b0d4 0%,#8f98c9 100%);
    min-height:100vh;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding:56px 22px 70px;
  }
  .wrap{ max-width:940px; margin:0 auto; }

  header.top{
    text-align:center;
    margin-bottom:42px;
  }
  header.top h1{
    font-size:38px;
    font-weight:800;
    color:#fff;
    letter-spacing:.5px;
    text-shadow:0 2px 10px rgba(15,18,54,.35);
  }
  header.top p{
    margin-top:10px;
    color:#eef0fb;
    font-size:15px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:22px;
  }

  .cv-card{
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 12px 32px rgba(15,18,54,.28);
    text-decoration:none;
    color:inherit;
    display:flex;
    flex-direction:column;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .cv-card:hover{
    transform:translateY(-5px);
    box-shadow:0 20px 42px rgba(15,18,54,.4);
  }

  .card-top{
    background:var(--navy);
    height:120px;
    position:relative;
    display:flex;
    align-items:flex-end;
    padding:0 18px;
  }
  .card-top .avatar{
    width:92px; height:92px;
    border-radius:50%;
    border:4px solid #fff;
    object-fit:cover;
    object-position:center top;
    background:#fff;
    position:absolute;
    left:18px; bottom:-46px;
    box-shadow:0 6px 16px rgba(0,0,0,.25);
  }
  .card-top .chev{
    position:absolute; left:0; bottom:0;
    width:100%; height:34px;
    background:var(--navy);
    clip-path:polygon(0 0,100% 0,50% 100%);
    z-index:1;
  }

  .card-body{
    padding:58px 18px 20px;
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
  }
  .card-body h2{
    font-size:20px;
    color:var(--navy-soft);
    font-weight:700;
  }
  .card-body .role{
    margin-top:4px;
    font-size:13px;
    font-weight:600;
    color:var(--pink);
    text-transform:uppercase;
    letter-spacing:.6px;
  }
  .card-body .meta{
    margin-top:10px;
    font-size:12.5px;
    color:var(--muted);
    line-height:1.5;
    flex:1 1 auto;
  }
  .card-body .btn{
    margin-top:16px;
    align-self:flex-start;
    background:var(--navy);
    color:#fff;
    font-size:12.5px;
    font-weight:600;
    padding:9px 16px;
    border-radius:8px;
    transition:background .15s ease;
  }
  .cv-card:hover .btn{ background:var(--pink); }

  footer.foot{
    text-align:center;
    margin-top:48px;
    color:#eef0fb;
    font-size:12.5px;
    opacity:.85;
  }

  @media (max-width:520px){
    header.top h1{ font-size:29px; }
    body{ padding:36px 14px 50px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>CV Library</h1>
      <p>Browse available curriculum vitae. Click a card to view and download the CV as PDF.</p>
    </header>

    <div class="grid">

      <!-- ===== Mamun CV ===== -->
      <a class="cv-card" href="mamun/">
        <div class="card-top">
          <div class="chev"></div>
          <img class="avatar" src="mamun/mamun_pic.png" alt="MD. Mamun" />
        </div>
        <div class="card-body">
          <h2>MD. Mamun</h2>
          <div class="role">Diploma in Civil Engineering</div>
          <p class="meta">
            Business owner with 5+ years of experience in business management,
            customer service, computer operations, and digital services.
          </p>
          <span class="btn">View CV &rarr;</span>
        </div>
      </a>

      <!-- Copy the block above (change folder/photo/name) to add more CVs -->

    </div>

    <footer class="foot">© CV Library</footer>
  </div>
</body>
</html>
